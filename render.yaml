# Render Blueprint: render.com → New → Blueprint → pick this repository. Gives a permanent https:// link.
services:
  - type: web
    name: fitvision-ai
    runtime: docker
    dockerfilePath: ./Dockerfile.cloud
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "1"
      # permanent data: paste the connection string of a free Neon PostgreSQL database (neon.tech).
      # Left empty, the service falls back to SQLite inside the container, which is reset on every restart.
      - key: DATABASE_URL
        sync: false
