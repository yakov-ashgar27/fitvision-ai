# Render Blueprint: render.com → New → Blueprint → pick this repository. Gives a permanent https:// link.
services:
  - type: web
    name: fitvision-ai
    runtime: docker
    dockerfilePath: ./Dockerfile.cloud
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO
        value: "1"
