server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 5m;

  # compression (6.3.2): text assets and API JSON; PDF/XLSX are already compressed
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml application/wasm;

  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # hashed build files, WASM and models never change: cache for a year (CDN-friendly)
  location ~ ^/(assets|mediapipe|models|icons)/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location = /pose-worker.js { add_header Cache-Control "no-cache"; }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
